  - :title: Volatile food trade policy threatens biodiversity | Science
    :link: https://www.science.org/doi/10.1126/science.aeh4080
    :published_date: '2026-05-28'
    :authors: []
    :description: International trade has benefited food security and biodiversity
      by leveraging the comparative advantages of countries (1), but the role of international
      trade stability in safeguarding ecosystems is often overlooked. Volatile food
      trade policies such as trade bans in response to the COVID-19 pandemic (2),
      export restrictions related to the Russia’s invasion of Ukraine (3), and import
      tariffs imposed by the Trump administration (4) have reshaped the food supply
      chain, leading to cascading effects on biodiversity loss through agricultural
      production (5), land use change (6), and natural resource use (7). Prioritizing
      trade policy stability and clarifying its connection to biodiversity conservation
      can offer a pathway toward improving both food security and ecological resilience.
